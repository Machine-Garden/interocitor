<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" fill="none">
  <style>
    .box { stroke: #1a1a1a; stroke-width: 1.5; fill: none; rx: 3; }
    .box-filled { fill: #f5f5f5; stroke: #1a1a1a; stroke-width: 1.5; }
    .label { font-family: 'Courier New', monospace; font-size: 12px; fill: #1a1a1a; text-anchor: middle; }
    .label-sm { font-family: 'Courier New', monospace; font-size: 10px; fill: #666; text-anchor: middle; }
    .label-xs { font-family: 'Courier New', monospace; font-size: 9px; fill: #999; text-anchor: middle; }
    .arrow { stroke: #1a1a1a; stroke-width: 1.2; marker-end: url(#arrowhead); }
    .arrow-dashed { stroke: #999; stroke-width: 1; stroke-dasharray: 4 2; marker-end: url(#arrowhead-light); }
    .group-label { font-family: 'Courier New', monospace; font-size: 11px; fill: #999; text-anchor: start; letter-spacing: 2px; }
    .divider { stroke: #ddd; stroke-width: 0.5; stroke-dasharray: 2 4; }
    @media (prefers-color-scheme: dark) {
      .box { stroke: #ccc; }
      .box-filled { fill: #2a2a2a; stroke: #ccc; }
      .label { fill: #e0e0e0; }
      .label-sm { fill: #999; }
      .label-xs { fill: #666; }
      .arrow { stroke: #ccc; }
      .arrow-dashed { stroke: #666; }
      .group-label { fill: #666; }
      .divider { stroke: #444; }
    }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </marker>
    <marker id="arrowhead-light" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#999" stroke-width="1"/>
    </marker>
  </defs>

  <!-- === DEVICE A === -->
  <text x="32" y="28" class="group-label">DEVICE A</text>
  <line x1="30" y1="34" x2="240" y2="34" class="divider"/>

  <!-- App -->
  <rect x="60" y="56" width="140" height="36" class="box" rx="3"/>
  <text x="130" y="79" class="label">put() / delete()</text>

  <!-- IDB -->
  <rect x="60" y="124" width="140" height="36" class="box-filled" rx="3"/>
  <text x="130" y="147" class="label">IndexedDB</text>

  <!-- Outbox -->
  <rect x="60" y="192" width="140" height="36" class="box" rx="3"/>
  <text x="130" y="215" class="label">outbox queue</text>

  <!-- Arrows -->
  <line x1="130" y1="92" x2="130" y2="124" class="arrow"/>
  <text x="178" y="113" class="label-xs">immediate</text>
  <line x1="130" y1="160" x2="130" y2="192" class="arrow-dashed"/>

  <!-- === CLOUD === -->
  <text x="332" y="28" class="group-label">CLOUD FOLDER</text>
  <line x1="330" y1="34" x2="500" y2="34" class="divider"/>

  <!-- Cloud box -->
  <rect x="330" y="108" width="170" height="154" class="box" rx="3" stroke-dasharray="6 3"/>

  <text x="415" y="132" class="label">changes/</text>
  <text x="415" y="149" class="label-sm">*.json  (one per flush)</text>
  <line x1="345" y1="158" x2="485" y2="158" class="divider"/>
  <text x="415" y="174" class="label">manifest.json</text>
  <text x="415" y="190" class="label-sm">epoch · watermark · gcFloor</text>
  <line x1="345" y1="200" x2="485" y2="200" class="divider"/>
  <text x="415" y="216" class="label">devices/</text>
  <text x="415" y="232" class="label-sm">observed watermark acks</text>
  <line x1="345" y1="241" x2="485" y2="241" class="divider"/>
  <text x="415" y="254" class="label-sm">head.json latest HLC</text>

  <!-- flush arrow A → Cloud -->
  <line x1="200" y1="210" x2="328" y2="180" class="arrow"/>
  <text x="254" y="186" class="label-xs">flush</text>

  <!-- === DEVICE B === -->
  <text x="562" y="28" class="group-label">DEVICE B</text>
  <line x1="560" y1="34" x2="770" y2="34" class="divider"/>

  <!-- IDB B -->
  <rect x="600" y="124" width="140" height="36" class="box-filled" rx="3"/>
  <text x="670" y="147" class="label">IndexedDB</text>

  <!-- Merge -->
  <rect x="600" y="56" width="140" height="36" class="box" rx="3"/>
  <text x="670" y="79" class="label">CRDT merge</text>

  <!-- Query -->
  <rect x="600" y="192" width="140" height="36" class="box" rx="3"/>
  <text x="670" y="215" class="label">get() / query()</text>

  <!-- Cloud → B -->
  <line x1="502" y1="180" x2="598" y2="147" class="arrow"/>
  <text x="556" y="154" class="label-xs">poll</text>

  <!-- Merge → IDB -->
  <line x1="670" y1="92" x2="670" y2="124" class="arrow"/>

  <!-- IDB → Query -->
  <line x1="670" y1="160" x2="670" y2="192" class="arrow"/>
  <text x="718" y="181" class="label-xs">local read</text>

  <!-- === ENCRYPTION LAYER === -->
  <rect x="290" y="272" width="250" height="30" class="box" rx="3" stroke-dasharray="3 2"/>
  <text x="415" y="292" class="label-sm">AES-256-GCM · cloud sees ciphertext only</text>

  <line x1="415" y1="262" x2="415" y2="272" class="arrow-dashed"/>

  <!-- === GC FLOOR NOTE === -->
  <rect x="235" y="320" width="360" height="28" class="box" rx="3" stroke-dasharray="3 2"/>
  <text x="415" y="338" class="label-sm">gcFloor: stale pre-floor outbox must rehydrate, not flush</text>

  <!-- === LEGEND === -->
  <line x1="60" y1="356" x2="88" y2="356" class="arrow"/>
  <text x="94" y="360" class="label-xs" text-anchor="start">data flow</text>
  <line x1="160" y1="356" x2="188" y2="356" class="arrow-dashed"/>
  <text x="194" y="360" class="label-xs" text-anchor="start">async / optional</text>
</svg>

name = "todo-cloudflare-do-playwright"
main = "src/worker.js"
compatibility_date = "2026-04-07"

[vars]
INTEROCITOR_APPEND_ONLY = "1"
INTEROCITOR_VERBOSE = "1"
INTEROCITOR_ACCESS_TOKEN = "playwright-access-secret"
INTEROCITOR_EXEC_TOKEN = "playwright-exec-secret"

[[d1_databases]]
binding = "TODO_DB"
database_name = "todo-cloudflare-do-db"
database_id = "REPLACE_WITH_REAL_D1_DATABASE_ID"
preview_database_id = "REPLACE_WITH_REAL_D1_PREVIEW_DATABASE_ID"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "TODO_DAV"
class_name = "TodoDavBroadcaster"

[[migrations]]
tag = "v1"
new_classes = ["TodoDavBroadcaster"]

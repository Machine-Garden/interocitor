name = "todo-cloudflare-do"
main = "./todo-interocitor.js"
compatibility_date = "2026-04-07"

[vars]
# Set to "1" to emit per-request traces to worker logs (wrangler tail / dev console).
# Flip to "0" in production to silence routine traffic.
INTEROCITOR_VERBOSE = "1"
TODO_MESH_BEARER_SECRET = "replace-with-production-secret"
TODO_SYSTEM_BEARER_TOKEN = "replace-with-production-system-secret"
INTEROCITOR_MESH_SECRET = "replace-with-production-mesh-secret"
INTEROCITOR_ENABLE_SCHEDULED_MAINTENANCE = "1"
INTEROCITOR_PATH_TTL_HOURS = "168"
INTEROCITOR_MAX_CONTROL_BYTES = "262144"
INTEROCITOR_MAX_CHANGE_BYTES = "8388608"
INTEROCITOR_MAX_MAINLINE_BYTES = "16777216"
INTEROCITOR_MAX_GENERIC_FILE_BYTES = "8388608"
INTEROCITOR_MAX_STORED_FILE_BYTES = "33554432"
INTEROCITOR_MAX_MESH_STORED_BYTES = "536870912"

[triggers]
crons = ["0 */4 * * *"]

[[d1_databases]]
binding = "INTEROCITOR_DB"
database_name = "todo-cloudflare-do-db"
# Replace with your real D1 IDs after `wrangler d1 create todo-cloudflare-do-db`.
database_id = "REPLACE_WITH_REAL_D1_DATABASE_ID"
preview_database_id = "REPLACE_WITH_REAL_D1_PREVIEW_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "INTEROCITOR_FILES"
bucket_name = "todo-cloudflare-do-files"
preview_bucket_name = "todo-cloudflare-do-files-preview"

[[durable_objects.bindings]]
name = "INTEROCITOR_RELAY"
class_name = "InterocitorRelayDurableObject"

[[migrations]]
tag = "v1"
new_classes = ["InterocitorRelayDurableObject"]

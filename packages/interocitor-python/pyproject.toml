[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interocitor"
version = "0.1.0"
description = "Python client primitives for the Interocitor encrypted mesh protocol."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["cryptography>=42.0.0", "httpx>=0.27.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Import the package from the source tree so `yarn preflight:python` and plain
# `pytest` work without `pip install -e .`. An editable install is what writes
# the (git-ignored) src/interocitor.egg-info directory; it is not needed here.
pythonpath = ["src"]
